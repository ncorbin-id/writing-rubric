            font-weight: 600;
            width: 50px;
            text-align: center;
        }

        .rubric-levels-table td p {
            margin: 0;
        }

<script id="mighty-interactive-sdk" src="https://sdk.designwithmighty.com/v1/mighty-interactive-sdk.min.js"></script><script id="mighty-rte-bridge" src="https://sdk.designwithmighty.com/mighty-rte-bridge/mighty-rte-bridge.min.js"></script></head>
<body>
    <div id="app">
        <section id="writing-screen">
            <div id="prompt" class="prompt-box"></div>

                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M4 2h4.5a2.75 2.75 0 0 1 1.7 4.92A3 3 0 0 1 8.75 13H4V2Zm2 1.6v3.3h2.3a1.65 1.65 0 0 0 0-3.3H6Zm0 4.9v3.9h2.75a1.95 1.95 0 0 0 0-3.9H6Z" fill="currentColor"></path></svg>

    <script>
        const sdk = window.mightyInteractiveSdk;

        const HIGHLIGHT_COLORS = [
            { key: 'yellow', color: '#fde68a' },
            { key: 'green', color: '#bbf7d0' },
            { key: 'pink', color: '#fbcfe8' },
            { key: 'blue', color: '#bfdbfe' },
            { key: 'orange', color: '#fed7aa' },
        ];

        sdk.onSdkReady(async () => {
            const config = await sdk.state.getState({
                prompt: '<p><strong>Open the <em>Presets</em> for additional writing prompt starters</strong></p><p>You are a marketing manager, and last week you asked your direct report, Jordan, to prepare a client presentation for the Anderson account on short notice. Jordan’s data analysis was strong and the client was impressed, but several slides were text-heavy and hard to follow, and the pacing felt rushed.</p><p><strong>Your task:</strong> Write a message to Jordan giving constructive feedback. Acknowledge what went well, address the areas that need improvement, and offer a clear, actionable suggestion for next time. Keep the tone professional but supportive, and aim for 150–250 words.</p>',
                criteria: [
                    {
                        title: '<p>Situation</p>',
                        question: '<p>Could the listener immediately recognize the situation you’re referring to?</p>',
                        levels: [
                            { score: 4, description: '<p>Names the specific situation (what, when) so the reader immediately knows what’s being discussed.</p>' },
                            { score: 3, description: '<p>Situation is identifiable, but specifics aren’t clearly named.</p>' },
                            { score: 2, description: '<p>Situation is vague or has to be inferred.</p>' },
                            { score: 1, description: '<p>No clear situation named.</p>' },
                        ],
                    },
                    {
                        title: '<p>Behavior</p>',
                        question: '<p>Does the feedback name the specific issue, tie it to an expectation, and state its effect?</p>',
                        levels: [
                            { score: 4, description: '<p>Names the specific issue, states the expectation it fell short of, and describes its effect (on the audience, outcome, etc.).</p>' },
                            { score: 3, description: '<p>Covers issue, expectation, and effect, but one of the three is underdeveloped or left implicit.</p>' },
                            { score: 2, description: '<p>Names a general problem area without a clear expectation or effect attached.</p>' },
                            { score: 1, description: '<p>No issue identified, or only trait-based judgment (e.g., "needs to improve communication").</p>' },
                        ],
                    },
                    {
                        title: '<p>Next step</p>',
                        question: '<p>Is there a concrete, actionable suggestion for next time?</p>',
                        levels: [
                            { score: 4, description: '<p>Gives a concrete, actionable suggestion the person can apply next time.</p>' },
                            { score: 3, description: '<p>Suggestion is present but somewhat vague or generic.</p>' },
                            { score: 2, description: '<p>Suggestion is present but not actionable (e.g., "try to do better").</p>' },
                            { score: 1, description: '<p>No next step offered.</p>' },
                        ],
                    },
                ],
                conclusion: '<p>Good feedback names <strong>where</strong> (the situation), <strong>what and why it mattered</strong> (behavior tied to an expectation, plus its impact), and <strong>what to do differently</strong> (a concrete next step). If a piece of feedback is missing any one of these, the listener is left doing work the writer should have done. Keep this in mind for next time.</p>',
                promptBackgroundColor: '#f0f5ff',
                conclusionBackgroundColor: '#ffffff',
                accentColor: '#2563eb',
            });

            sdk.registerTracking({
                completion: { description: 'Completes when the learner finishes self-grading all criteria and sees their final score' },
            });

            // ---- Author-configurable colors ----
            function hexToRgb(hex) {
                const int = parseInt(hex.replace('#', ''), 16);
                return [(int >> 16) & 255, (int >> 8) & 255, int & 255];
            }

            function mixColor(hex, target, amount) {
                const [r, g, b] = hexToRgb(hex);
                const [tr, tg, tb] = target;
                const mixChannel = (c, t) => Math.round(c + (t - c) * amount);
                return `rgb(${mixChannel(r, tr)}, ${mixChannel(g, tg)}, ${mixChannel(b, tb)})`;
            }

            const lighten = (hex, amount) => mixColor(hex, [255, 255, 255], amount);
            const darken = (hex, amount) => mixColor(hex, [0, 0, 0], amount);

            const accentColor = config.accentColor || '#2563eb';
            const rootStyle = document.documentElement.style;
            rootStyle.setProperty('--accent-color', accentColor);
            rootStyle.setProperty('--accent-hover', darken(accentColor, 0.15));
            rootStyle.setProperty('--accent-soft', lighten(accentColor, 0.85));
            rootStyle.setProperty('--accent-border-soft', lighten(accentColor, 0.5));
            rootStyle.setProperty('--prompt-bg-color', config.promptBackgroundColor || 'transparent');
            rootStyle.setProperty('--conclusion-bg-color', config.conclusionBackgroundColor || 'transparent');

            document.getElementById('prompt').innerHTML = config.prompt;
            document.getElementById('conclusion').innerHTML = config.conclusion;

            // ---- Sanitization ----
            function sanitizeUrl(url) {
                try {
                    const parsed = new URL(url, window.location.href);
                    if (['http:', 'https:', 'mailto:'].includes(parsed.protocol)) {
                        return parsed.href;
                    }
                } catch (e) {
                    // fall through to null below
                }
                return null;
            }

            const SANITIZE_ALLOWED_TAGS = new Set(['P', 'BR', 'STRONG', 'B', 'EM', 'I', 'UL', 'OL', 'LI', 'A', 'H2', 'H3', 'DIV', 'SPAN']);
            const SANITIZE_REMOVE_TAGS = new Set(['SCRIPT', 'STYLE', 'IFRAME', 'OBJECT', 'EMBED', 'LINK', 'META', 'BASE']);

            function sanitizeHtml(html) {
                const template = document.createElement('template');
                template.innerHTML = html;

                const toRemove = [];
                const toUnwrap = [];
                const walker = document.createTreeWalker(template.content, NodeFilter.SHOW_ELEMENT);
                let node = walker.nextNode();
                while (node) {
                    const tag = node.tagName;
                    if (SANITIZE_REMOVE_TAGS.has(tag)) {
                        toRemove.push(node);
                    } else if (!SANITIZE_ALLOWED_TAGS.has(tag)) {
                        toUnwrap.push(node);
                    } else {
                        const href = tag === 'A' ? sanitizeUrl(node.getAttribute('href') || '') : null;
                        [...node.attributes].forEach((attr) => node.removeAttribute(attr.name));
                        if (tag === 'A') {
                            if (href) {
                                node.setAttribute('href', href);
                                node.setAttribute('rel', 'noopener noreferrer');
                                node.setAttribute('target', '_blank');
                            }
                        }
                    }
                    node = walker.nextNode();
                }

                toRemove.forEach((el) => el.remove());
                toUnwrap.forEach((el) => {
                    const parent = el.parentNode;
                    while (el.firstChild) parent.insertBefore(el.firstChild, el);
                    parent.removeChild(el);
                });

                return template.innerHTML;
            }

            // ---- Writing screen ----
            const editor = document.getElementById('editor');
            const submitBtn = document.getElementById('submit-btn');
            const headingSelect = document.getElementById('heading-select');
            const toolbar = document.querySelector('.toolbar');

            function updateEmptyState() {
                const isEmpty = editor.textContent.trim() === '';
                editor.classList.toggle('is-empty', isEmpty);
                submitBtn.disabled = isEmpty;
            }

            function updateToolbarState() {
                toolbar.querySelectorAll('button[data-cmd]').forEach((btn) => {
                    const active = document.queryCommandState(btn.dataset.cmd);
                    btn.classList.toggle('is-active', !!active);
                });
                const block = document.queryCommandValue('formatBlock').toLowerCase();
                headingSelect.value = block === 'h2' || block === 'h3' ? block : 'p';
            }

            editor.addEventListener('input', () => {
                updateEmptyState();
                updateToolbarState();
            });
            editor.addEventListener('keyup', updateToolbarState);
            editor.addEventListener('mouseup', updateToolbarState);

            toolbar.querySelectorAll('button[data-cmd]').forEach((btn) => {
                btn.addEventListener('click', () => {
                    editor.focus();
                    document.execCommand(btn.dataset.cmd);
                    updateEmptyState();
                    updateToolbarState();
                });
            });

            headingSelect.addEventListener('change', () => {
                editor.focus();
                document.execCommand('formatBlock', false, headingSelect.value);
                updateToolbarState();
            });

            document.getElementById('link-btn').addEventListener('click', () => {
                const selection = window.getSelection();
                const hasSelection = selection && !selection.isCollapsed;
                const rawUrl = window.prompt('Enter a URL:', 'https://');
                if (!rawUrl) return;
                const safeUrl = sanitizeUrl(rawUrl);
                if (!safeUrl) {
                    window.alert('Please enter a valid http(s) or mailto link.');
                    return;
                }
                editor.focus();
                if (!hasSelection) {
                    const link = document.createElement('a');
                    link.href = safeUrl;
                    link.textContent = safeUrl;
                    document.execCommand('insertHTML', false, link.outerHTML);
                } else {
                    document.execCommand('createLink', false, safeUrl);
                }
                updateEmptyState();
            });

            // ---- Guided review flow ----
            const criteria = config.criteria || [];
            const writingScreen = document.getElementById('writing-screen');
            const reviewScreen = document.getElementById('review-screen');
            const finalScreen = document.getElementById('final-screen');
            const writingDisplay = document.getElementById('writing-display');
            const criterionPanel = document.getElementById('criterion-panel');
            const stepLabel = document.getElementById('step-label');
            const stepDots = document.getElementById('step-dots');

            // ---- Rubric preview modal ----
            const rubricModal = document.getElementById('rubric-modal');
            document.getElementById('rubric-modal-body').innerHTML = criteria.map((criterion) => {
                const rows = [...(criterion.levels || [])]
                    .sort((a, b) => b.score - a.score)
                    .map((level) => `
                        <tr>
                            <td class="score-cell">${level.score}</td>
                            <td>${level.description}</td>
                        </tr>
                    `).join('');
                return `
                    <div class="rubric-criterion-card">
                        <div class="rubric-criterion-header">
                            <div class="rubric-criterion-title">${criterion.title}</div>
                            <div class="rubric-criterion-question">${criterion.question}</div>
                        </div>
                        <table class="rubric-levels-table">
                            <thead><tr><th>Score</th><th>Description</th></tr></thead>
                            <tbody>${rows}</tbody>
                        </table>
                    </div>
                `;
            }).join('');

            const rubricModalClose = document.getElementById('rubric-modal-close');
            let rubricModalTrigger = null;

            function trapRubricModalFocus(e) {
                if (e.key === 'Escape') {
                    closeRubricModal();
                    return;
                }
                if (e.key !== 'Tab') return;
                const focusable = rubricModal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
                if (!focusable.length) return;
                const first = focusable[0];
                const last = focusable[focusable.length - 1];
                if (e.shiftKey && document.activeElement === first) {
                    e.preventDefault();
                    last.focus();
                } else if (!e.shiftKey && document.activeElement === last) {
                    e.preventDefault();
                    first.focus();
                }
            }

            function openRubricModal() {
                rubricModalTrigger = document.activeElement;
                rubricModal.hidden = false;
                rubricModalClose.focus();
                document.addEventListener('keydown', trapRubricModalFocus);
            }

            function closeRubricModal() {
                rubricModal.hidden = true;
                document.removeEventListener('keydown', trapRubricModalFocus);
                if (rubricModalTrigger) rubricModalTrigger.focus();
            }

            document.getElementById('review-rubric-btn').addEventListener('click', openRubricModal);
            rubricModalClose.addEventListener('click', closeRubricModal);
            rubricModal.addEventListener('click', (e) => {
                if (e.target === rubricModal) closeRubricModal();
            });

            let currentIndex = 0;
            let phase = 'highlight'; // 'highlight' | 'score'
            let learnerHTML = '';
            let activeColor = HIGHLIGHT_COLORS[0];
            let eraserActive = false;
            const results = [];

            function showScreen(name) {
                writingScreen.hidden = name !== 'writing';
                reviewScreen.hidden = name !== 'review';
                finalScreen.hidden = name !== 'final';
            }

            function getTextNodesInRange(range) {
                const root = range.commonAncestorContainer;
                if (root.nodeType === Node.TEXT_NODE) return [root];
                const nodes = [];
                const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
                    acceptNode(node) {
                        return range.intersectsNode(node) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
                    },
                });
                let node;
                while ((node = walker.nextNode())) nodes.push(node);
                return nodes;
            }

            function applyHighlight(range, colorHex) {
                getTextNodesInRange(range).forEach((node) => {
                    if (!node.textContent.trim()) return;
                    const nodeRange = document.createRange();
                    nodeRange.selectNodeContents(node);
                    if (node === range.startContainer) nodeRange.setStart(node, range.startOffset);
                    if (node === range.endContainer) nodeRange.setEnd(node, range.endOffset);
                    if (nodeRange.collapsed) return;
                    const mark = document.createElement('mark');
                    mark.className = 'hl';
                    mark.style.backgroundColor = colorHex;
                    nodeRange.surroundContents(mark);
                });
            }

            function unwrapMark(mark) {
                const parent = mark.parentNode;
                while (mark.firstChild) parent.insertBefore(mark.firstChild, mark);
                parent.removeChild(mark);
                parent.normalize();
            }

            // ---- Keyboard path: focusable, toggleable sentence chunks ----
            function charOffsetToNodePosition(block, offset) {
                const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
                let remaining = offset;
                let node = walker.nextNode();
                while (node) {
                    if (remaining <= node.textContent.length) {
                        return { node, offset: remaining };
                    }
                    remaining -= node.textContent.length;
                    node = walker.nextNode();
                }
                return null;
            }

            function charOffsetsToRange(block, startOffset, endOffset) {
                const start = charOffsetToNodePosition(block, startOffset);
                const end = charOffsetToNodePosition(block, endOffset);
                if (!start || !end) return null;
                const range = document.createRange();
                range.setStart(start.node, start.offset);
                range.setEnd(end.node, end.offset);
                return range;
            }

            const SENTENCE_ABBREVIATIONS = new Set(['mr', 'mrs', 'ms', 'dr', 'st', 'jr', 'sr', 'prof', 'vs', 'etc', 'inc', 'ltd', 'co', 'no']);

            function endsWithAbbreviation(text, periodIndex) {
                let i = periodIndex;
                let word = '';
                while (i > 0 && /[a-zA-Z]/.test(text[i - 1])) {
                    word = text[i - 1] + word;
                    i--;
                }
                return SENTENCE_ABBREVIATIONS.has(word.toLowerCase());
            }

            function wrapSentencesInBlock(block) {
                const text = block.textContent;
                if (!text.trim()) return;

                const boundaries = [];
                const sentenceEndRegex = /[.!?]+(?=\s|$)/g;
                let match;
                while ((match = sentenceEndRegex.exec(text))) {
                    if (match[0] === '.' && endsWithAbbreviation(text, match.index)) continue;
                    boundaries.push(match.index + match[0].length);
                }
                if (!boundaries.length || boundaries[boundaries.length - 1] < text.length) {
                    boundaries.push(text.length);
                }

                let start = 0;
                const segments = [];
                boundaries.forEach((end) => {
                    let segStart = start;
                    while (segStart < end && /\s/.test(text[segStart])) segStart++;
                    if (segStart < end) segments.push([segStart, end]);
                    start = end;
                });

                segments
                    .map(([s, e]) => charOffsetsToRange(block, s, e))
                    .reverse()
                    .forEach((range) => {
                        if (!range) return;
                        const span = document.createElement('span');
                        span.className = 'hl-sentence';
                        span.tabIndex = 0;
                        span.setAttribute('role', 'button');
                        span.setAttribute('aria-pressed', 'false');
                        const fragment = range.extractContents();
                        span.appendChild(fragment);
                        range.insertNode(span);
                    });
            }

            function wrapSentencesForKeyboard(container) {
                const blocks = [...container.querySelectorAll('p, li, h2, h3, div')];
                (blocks.length ? blocks : [container]).forEach(wrapSentencesInBlock);
            }

            function toggleSentenceHighlight(sentenceEl) {
                const existingMarks = sentenceEl.querySelectorAll('mark.hl');
                if (existingMarks.length) {
                    existingMarks.forEach(unwrapMark);
                    sentenceEl.setAttribute('aria-pressed', 'false');
                } else {
                    const mark = document.createElement('mark');
                    mark.className = 'hl';
                    mark.style.backgroundColor = activeColor.color;
                    while (sentenceEl.firstChild) mark.appendChild(sentenceEl.firstChild);
                    sentenceEl.appendChild(mark);
                    sentenceEl.setAttribute('aria-pressed', 'true');
                }
            }

            writingDisplay.addEventListener('keydown', (e) => {
                if (phase !== 'highlight') return;
                if (e.key !== 'Enter' && e.key !== ' ') return;
                const sentenceEl = e.target.closest('.hl-sentence');
                if (!sentenceEl) return;
                e.preventDefault();
                toggleSentenceHighlight(sentenceEl);
            });

            writingDisplay.addEventListener('mouseup', () => {
                if (phase !== 'highlight' || eraserActive) return;
                const selection = window.getSelection();
                if (!selection || selection.isCollapsed) return;
                const range = selection.getRangeAt(0);
                if (!writingDisplay.contains(range.commonAncestorContainer)) return;
                applyHighlight(range, activeColor.color);
                selection.removeAllRanges();
            });

            writingDisplay.addEventListener('click', (e) => {
                if (phase !== 'highlight' || !eraserActive) return;
                const mark = e.target.closest('mark.hl');
                if (mark) unwrapMark(mark);
            });

            function renderStepper() {
                stepLabel.textContent = `Criterion ${currentIndex + 1} of ${criteria.length}`;
                stepDots.innerHTML = criteria.map((_, i) => {
                    const cls = i === currentIndex ? 'dot current' : i < currentIndex ? 'dot done' : 'dot';
                    return `<span class="${cls}"></span>`;
                }).join('');
            }

            function renderHighlightPanel(criterion) {
                writingDisplay.classList.toggle('erasing', eraserActive);
                criterionPanel.innerHTML = `
                    <div class="criterion-title">${criterion.title}</div>
                    <div class="criterion-question">${criterion.question}</div>
                    <p class="instruction">Choose any color to highlight the portions of your writing that you believe satisfy this criterion.</p>
                    <div class="highlight-toolbar">
                        <div class="color-swatches">
                            ${HIGHLIGHT_COLORS.map((c) => `<button type="button" class="color-swatch${!eraserActive && c.key === activeColor.key ? ' is-active' : ''}" data-color-key="${c.key}" style="background-color:${c.color}" title="${c.key} highlight"></button>`).join('')}
                        </div>
                        <button type="button" class="eraser-btn${eraserActive ? ' is-active' : ''}" id="eraser-toggle">Eraser</button>
                    </div>
                    <p class="keyboard-hint">Keyboard users: press <kbd>Tab</kbd> to move between sentences, then <kbd>Enter</kbd> or <kbd>Space</kbd> to highlight or remove the highlight from one.</p>
                    <div class="panel-actions">
                        <button type="button" class="next-btn" id="highlight-next-btn">Next</button>
                    </div>
                `;
            }

            function renderScorePanel(criterion) {
                writingDisplay.classList.remove('erasing');
                const levels = [...(criterion.levels || [])].sort((a, b) => b.score - a.score);
                criterionPanel.innerHTML = `
                    <div class="criterion-title">${criterion.title}</div>
                    <div class="criterion-question">${criterion.question}</div>
                    <p class="instruction">Review your highlighted writing, then choose the level that best matches.</p>
                    <div class="levels-list">
                        ${levels.map((level) => `
                            <label class="level-option">
                                <input type="radio" name="level-choice" value="${level.score}">
                                <span class="level-score">${level.score}</span>
                                <span class="level-desc">${level.description}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div class="panel-actions">
                        <button type="button" class="next-btn" id="score-next-btn" disabled>Next</button>
                    </div>
                `;
            }

            function renderPanel() {
                renderStepper();
                const criterion = criteria[currentIndex];
                if (phase === 'highlight') {
                    renderHighlightPanel(criterion);
                } else {
                    renderScorePanel(criterion);
                }
            }

            criterionPanel.addEventListener('click', (e) => {
                const swatch = e.target.closest('.color-swatch');
                if (swatch) {
                    activeColor = HIGHLIGHT_COLORS.find((c) => c.key === swatch.dataset.colorKey) || activeColor;
                    eraserActive = false;
                    renderPanel();
                    return;
                }
                if (e.target.closest('#eraser-toggle')) {
                    eraserActive = !eraserActive;
                    renderPanel();
                    return;
                }
                if (e.target.closest('#highlight-next-btn')) {
                    phase = 'score';
                    renderPanel();
                    return;
                }
                if (e.target.closest('#score-next-btn')) {
                    advanceCriterion();
                }
            });

            criterionPanel.addEventListener('change', (e) => {
                if (e.target.name === 'level-choice') {
                    const nextBtn = document.getElementById('score-next-btn');
                    if (nextBtn) nextBtn.disabled = false;
                    criterionPanel.querySelectorAll('.level-option').forEach((label) => {
                        label.classList.toggle('is-selected', label.querySelector('input').checked);
                    });
                }
            });

            function loadCriterion() {
                phase = 'highlight';
                eraserActive = false;
                writingDisplay.innerHTML = learnerHTML;
                wrapSentencesForKeyboard(writingDisplay);
                renderPanel();
                const firstSentence = writingDisplay.querySelector('.hl-sentence');
                if (firstSentence) firstSentence.focus();
            }

            function advanceCriterion() {
                const checked = criterionPanel.querySelector('input[name="level-choice"]:checked');
                results[currentIndex] = checked ? Number(checked.value) : 0;
                if (currentIndex < criteria.length - 1) {
                    currentIndex += 1;
                    loadCriterion();
                } else {
                    showFinalScreen();
                }
            }

            function showFinalScreen() {
                let total = 0;
                let maxTotal = 0;
                const breakdownEl = document.getElementById('score-breakdown');
                breakdownEl.innerHTML = criteria.map((criterion, i) => {
                    const scores = (criterion.levels || []).map((l) => l.score);
                    const max = scores.length ? Math.max(...scores) : 0;
                    const score = results[i] ?? 0;
                    total += score;
                    maxTotal += max;
                    return `<li><div class="crit-name">${criterion.title}</div><div class="crit-score">${score} / ${max}</div></li>`;
                }).join('');
                document.getElementById('total-score').textContent = `${total} / ${maxTotal}`;
                showScreen('final');
                sdk.markAsComplete();
            }

            submitBtn.addEventListener('click', () => {
                learnerHTML = sanitizeHtml(editor.innerHTML);
                currentIndex = 0;
                results.length = 0;
                showScreen('review');
                loadCriterion();
            });

            document.getElementById('restart-btn').addEventListener('click', () => {
                editor.innerHTML = '';
                currentIndex = 0;
                phase = 'highlight';
                learnerHTML = '';
                activeColor = HIGHLIGHT_COLORS[0];
                eraserActive = false;
                results.length = 0;
                showScreen('writing');
                updateEmptyState();
            });

            updateEmptyState();
        });
    </script>


</body></html>
